name: launchd probe

# Throwaway: what a login item's children and environment are under launchd, for the updater a tray
# starts and then exits for. Removed before the branch is merged.
on:
  push:
    branches: [tool-update]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: What a login item has, and what outlives it
        run: |
          set -u
          uid=$(id -u)
          dir="$RUNNER_TEMP/probe"
          agents="$HOME/Library/LaunchAgents"
          mkdir -p "$dir" "$agents"
          sw_vers -productVersion
          echo "runner PATH: $PATH"
          echo "runner dotnet: $(command -v dotnet)"

          # $1 is where to write, $2 which shape of child to start.
          printf '%s\n' \
            '#!/bin/sh' \
            'echo "PATH=$PATH" > "$1.env"' \
            'echo "dotnet=$(command -v dotnet)" >> "$1.env"' \
            'if [ "$2" = brace ]; then' \
            '  /bin/bash -c '"'"'set -m; { /bin/sleep 120; } & echo $! > "$0"'"'"' "$1"' \
            'else' \
            '  /bin/sleep 120 &' \
            '  echo $! > "$1"' \
            'fi' \
            'exit 0' > "$dir/parent.sh"
          chmod +x "$dir/parent.sh"
          cat "$dir/parent.sh"

          probe() {
            name=$1
            mode=$2
            plist="$agents/$name.plist"
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>Label</key><string>%s</string><key>ProgramArguments</key><array><string>/bin/sh</string><string>%s</string><string>%s</string><string>%s</string></array><key>RunAtLoad</key><true/><key>LimitLoadToSessionType</key><string>Aqua</string></dict></plist>\n' \
              "$name" "$dir/parent.sh" "$dir/$name.pid" "$mode" > "$plist"
            launchctl bootstrap "gui/$uid" "$plist" || { echo "$name: could not be loaded"; return; }
            for i in $(seq 1 50); do
              [ -s "$dir/$name.pid" ] && break
              sleep 0.2
            done
            sleep 3
            child=$(cat "$dir/$name.pid" 2>/dev/null)
            if [ -n "$child" ] && kill -0 "$child" 2>/dev/null; then
              echo "RESULT $name: the child outlived its login item"
            else
              echo "RESULT $name: the child did not outlive its login item"
            fi
            sed "s/^/RESULT $name env: /" "$dir/$name.pid.env" || true
            launchctl bootout "gui/$uid/$name" 2>/dev/null || true
            [ -n "$child" ] && kill "$child" 2>/dev/null || true
          }

          probe probe.plain plain
          probe probe.brace brace
