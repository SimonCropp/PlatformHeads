name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both, because the tests pack an app whose heads are for both, and run the workflow's
        # check steps with whichever bash the machine has.
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The tag is the version: tag 1.2.3 builds 1.2.3. Other builds use the Version in
      # Directory.Build.props.
      - name: Resolve the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "VERSION_ARGUMENT=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Off Windows the solution is built as Release-NotWindows, which leaves out the WinForms tests:
      # they open real windows. Every other project is still built as Release.
      - name: Choose the configuration
        shell: bash
        run: echo "CONFIGURATION=${{ runner.os == 'Windows' && 'Release' || 'Release-NotWindows' }}" >> "$GITHUB_ENV"

      # A plain build is also the pack step: ProjectDefaults sets GeneratePackageOnBuild for a
      # Release package project, so this leaves the packages in ./nugets.
      - name: Build
        run: dotnet build src/PlatformHeads.slnx --configuration ${{ env.CONFIGURATION }} ${{ env.VERSION_ARGUMENT }}

      - name: Test
        run: dotnet test --solution src/PlatformHeads.slnx --configuration ${{ env.CONFIGURATION }} --no-build --no-restore

      - name: Upload package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: nugets/*.nupkg
          if-no-files-found: error
          retention-days: 30

  # The Swift package an app's macOS head depends on. AppKit is only on macOS, so this is the only
  # place it is compiled before an app takes a tag of it.
  swift:
    name: swift
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  # Trusted publishing: no stored API key. nuget.org validates GitHub's OIDC token against the
  # policy naming this repository, this workflow file and the nuget environment, and returns a
  # key good for an hour. Waits on every build, so a package only ships once the tests have
  # passed on Windows and on Linux, and a tag only once the Swift package builds.
  publish:
    needs: [build, swift]
    environment: nuget
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: packages

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: SimonCropp

      - name: Push to nuget.org
        run: >
          dotnet nuget push "packages/**/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
